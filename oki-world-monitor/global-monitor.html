async function renderMap(){
 const [topo,countries]=await Promise.all([
  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(r=>r.json()),
  fetch("https://cdn.jsdelivr.net/npm/world-countries@5.1.0/countries.json").then(r=>r.json())
 ]);
 countries.forEach(c=>{if(c.ccn3){nameByNumeric.set(c.ccn3,c.cca3);countryMeta.set(c.cca3,{name:c.name.common,ja:c.translations?.jpn?.common,region:c.region})}});
 const features=topojson.feature(topo,topo.objects.countries).features;
 const svg=d3.select("#map"),node=svg.node(),w=node.clientWidth||900,h=node.clientHeight||510;
 svg.attr("viewBox",`0 0 ${w} ${h}`);const projection=d3.geoNaturalEarth1().fitExtent([[10,12],[w-10,h-10]],{type:"FeatureCollection",features});const path=d3.geoPath(projection);
 svg.selectAll("path").data(features).join("path").attr("class","country").attr("d",path).attr("data-iso",f=>nameByNumeric.get(String(f.id).padStart(3,"0"))||"").attr("fill",f=>{const iso=nameByNumeric.get(String(f.id).padStart(3,"0"));return C[signal(data.worldMap.countries.find(x=>x.iso3===iso))]}).on("click",(e,f)=>{const iso=nameByNumeric.get(String(f.id).padStart(3,"0"));if(iso){selected=iso;renderCountry()}});
 document.querySelector(".map-message").style.display="none";renderCountry();
}

let publicJsonHash="";
async function sha256(text){if(!globalThis.crypto?.subtle)return"ブラウザ未対応";const bytes=new TextEncoder().encode(text);const digest=await crypto.subtle.digest("SHA-256",bytes);return Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase()}
fetch(`./data/global-monitor.json?t=${Date.now()}`,{cache:"no-store"}).then(async r=>{if(!r.ok)throw Error(r.status);const text=await r.text();publicJsonHash=await sha256(text);return JSON.parse(text)}).then(async d=>{data=d;renderHeader();await renderMap()}).catch(e=>{document.querySelector(".map-message").innerHTML=`<span class="error">データ読込に失敗しました：${e.message}</span>`});
