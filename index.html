<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沖縄県 行政区GDP検索ダッシュボード</title><style>:root{color-scheme:dark;--bg:#061411;--p:#0c211c;--l:#1d5c4e;--t:#edf8f4;--m:#91b8ae;--g:#35d39b;--b:#4db7ff;--y:#f3b543;--r:#ee6575}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 0,#123d33 0,#061411 35%,#040b0a 100%);color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}.side{border-right:1px solid var(--l);background:#071a16;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:12px;letter-spacing:.13em;color:var(--g);font-weight:800}.side h1{font-size:23px;line-height:1.3;margin:10px 0 22px}.label{font-size:13px;color:#9bd6c8;font-weight:800;margin:16px 0 8px}select,input,textarea{width:100%;border:1px solid #287866;background:#09231d;color:var(--t);border-radius:12px;padding:14px;font:inherit}.btn,.result{border:1px solid #2c8b74;background:#0d2a23;color:var(--t);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}.btn:hover,.result:hover{border-color:var(--g);background:#123a31}.results{display:grid;gap:8px;margin-top:12px}.result small{display:block;color:var(--m);margin-top:4px}.main{padding:28px;max-width:1320px;width:100%;margin:auto}.hero,.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.grid{margin-top:18px}.card{background:rgba(12,33,28,.9);border:1px solid #1d594c;border-radius:14px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.22)}h2{margin:0 0 14px;font-size:28px}.lead{color:#b6d5ce;line-height:1.75}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{background:#0a1e19;border:1px solid #1e5a4d;border-radius:12px;padding:14px}.kpi b{display:block;font-size:25px}.kpi span{color:var(--m);font-size:12px}.pill{display:inline-flex;border:1px solid #3b8f7a;border-radius:999px;padding:5px 10px;color:#c4efe3;font-size:12px;margin:4px 6px 4px 0}.score{height:9px;background:#18362f;border-radius:999px;overflow:hidden;margin-top:8px}.bar{height:100%;background:linear-gradient(90deg,var(--g),var(--b));width:0}.bar.yellow{background:linear-gradient(90deg,var(--y),#ffdb7a)}.bar.red{background:linear-gradient(90deg,var(--r),#ff9cab)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border-bottom:1px solid #1a4a40;padding:12px;text-align:left;vertical-align:top}th{color:#9edac9;background:#09231d}.status{font-size:12px;border-radius:999px;padding:4px 8px;border:1px solid var(--y);color:#ffd37d}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tool{border:1px solid #2d806d;background:#0a211c;color:var(--t);border-radius:10px;padding:9px 12px;cursor:pointer}textarea{min-height:230px;font-family:ui-monospace,Consolas,monospace;font-size:12px}.note{font-size:12px;color:#8eb9af;line-height:1.7}@media(max-width:940px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.hero,.grid{grid-template-columns:1fr}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="brand">OKINAWA DISTRICT GDP</div><h1>沖縄県データ × 市町村データ × 行政区GDP検索</h1><div class="label">市町村</div><select id="citySelect"></select><div class="label">調査分析地域を入力</div><input id="q" placeholder="例：名護市字辺野古 / 北谷町桑江 / 美浜"><div class="results" id="results"></div><div class="label">調査分析</div><button class="btn" id="analyzeBtn">入力地域を分析する</button><p class="note">Google Sheetsの行政区別推計税収タブから、行政区GDP列を作成済み。公開版は主要行政区はシート計算値、未登録行政区は同じ考え方で市町村GDPから推計します。</p></aside><main class="main"><section class="hero"><div class="card"><h2 id="title">調査分析地域を入力してください</h2><p class="lead" id="summary"></p><div id="tags"></div></div><div class="card kpis" id="kpis"></div></section><section class="grid"><div class="card"><h2>可視化</h2><div id="scores"></div></div><div class="card"><h2>調査分析判断</h2><p class="lead" id="strategy"></p><p class="note" id="risk"></p></div></section><section class="card" style="margin-top:18px"><h2>抽出データ</h2><div class="toolbar"><button class="tool" id="jsonBtn">JSON</button><button class="tool" id="csvBtn">CSV</button><button class="tool" id="copyBtn">コピー</button></div><textarea id="extract" spellcheck="false"></textarea></section><section class="card" style="margin-top:18px"><h2>沖縄県・市町村・行政区データ一覧</h2><table><thead><tr><th>市町村</th><th>行政区</th><th>推計GDP</th><th>総合</th><th>証拠</th><th>戦略</th></tr></thead><tbody id="table"></tbody></table></section></main></div><script>const cities=[['名護市','北部地区',64566,2209.04,203,88,'所得化・地元還流改善',60.5,39,51.3,76.1,3,1,'字宇茂佐'],['那覇市','那覇地区',308207,13938.76,260,202,'新規店舗フレンドリー',86.5,12.5,12,47.6,0,0,'字小禄'],['沖縄市','中部地区',141255,3364.13,202,148,'所得化・地元還流改善',61.3,37.7,48.8,72.1,11,0,'山内'],['宜野湾市','中部地区',99587,2281.02,214,67,'地域密着・既存店連携',54.9,45.7,54.4,67.5,22,0,'普天間'],['北谷町','中部地区',28386,874.31,272,24,'地域密着・既存店連携',44.7,55.3,61.2,58.7,0,4,'美浜'],['浦添市','中部地区',115123,4135.58,240,71,'地域密着・既存店連携',57.4,41.6,49.5,50.1,0,0,'牧港'],['豊見城市','南部地区',64865,1659.02,228,29,'ユイマール強・既存店優位',33.4,66.6,75.4,69.2,0,0,'豊崎'],['嘉手納町','中部地区',12947,393,328,7,'地域密着・既存店連携',42.3,57.7,55.1,31.6,7,0,'字嘉手納'],['読谷村','中部地区',41917,625.5,210,19,'地域密着・既存店連携',33.4,66.6,69,64.1,3,0,'楚辺'],['恩納村','北部地区',11278,487.99,237,11,'地域密着・既存店連携',33.8,66.2,59,69.1,0,11,'字恩納'],['うるま市','中部地区',127508,2712.3,174,76,'所得化・地元還流改善',42.9,62.1,61.5,75.4,40,0,'赤道'],['宮古島市','離島地区',52566,1785.43,223,41,'所得化・地元還流改善',42.9,56.1,52.1,71.7,0,0,'平良字下里'],['石垣市','離島地区',46648,1665.67,209,24,'所得化・地元還流改善',38.7,59.1,61.7,73.4,0,0,'字登野城'],['糸満市','南部地区',60850,1423.14,201,42,'ユイマール強・既存店優位',27.5,77.5,71,73.2,0,0,'糸満'],['南城市','南部地区',46582,883.75,204,48,'ユイマール強・既存店優位',23.9,81.1,83.5,72.4,0,0,'大里字稲嶺'],['西原町','中部地区',34840,1237.69,217,25,'ユイマール強・既存店優位',28.9,71.1,78.2,74.3,0,0,'翁長'],['南風原町','南部地区',41467,965.36,232,12,'ユイマール強・既存店優位',27.8,72.2,79.2,69,0,0,'津嘉山'],['八重瀬町','南部地区',32872,615.51,216,23,'ユイマール強・既存店優位',25,75,81.1,70.6,0,0,'東風平']].map(x=>({n:x[0],r:x[1],p:x[2],g:x[3],i:x[4],a:x[5],s:x[6],nb:x[7],cp:x[8],yu:x[9],lr:x[10],bf:x[11],rs:x[12],top:x[13]}));const known=[['名護市','字辺野古','米軍基地隣接・辺野古新基地工事導線',48.515,69.2,'observed_partial+estimated'],['名護市','字宇茂佐','税収上位・住宅/商業導線',265,86,'observed_partial+estimated'],['那覇市','字小禄','商業中心地',521.126,87.5,'observed_partial+estimated'],['北谷町','美浜','観光商業・アメリカンビレッジ周辺',269,96,'observed_partial'],['北谷町','伊平','米軍住宅・国道58号/生活導線',92,91,'estimated'],['北谷町','桑江','米軍住宅・北谷生活圏',83,89,'estimated'],['沖縄市','山内','現店舗 Family Tree Oki 周辺',119,84,'estimated'],['嘉手納町','字嘉手納','基地隣接・英語接触',180,86,'estimated'],['宜野湾市','普天間','基地・住宅・国道導線',160,81,'estimated'],['浦添市','牧港','国道58号・商業交通導線',695,87,'observed_partial'],['豊見城市','豊崎','大型商業・観光',465,90,'observed_partial']];let mode='json',selected=null;const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat('ja-JP');function norm(v){return String(v||'').toLowerCase().replace(/[\s　]/g,'').replace(/[ヶケ]/g,'ケ')}function cityOf(q){return cities.find(c=>q.includes(norm(c.n))||q.includes(norm(c.n.replace(/[市町村]$/,''))))}function clean(c,raw){let n=raw.trim().replace(new RegExp(c.n,'g'),'').replace(new RegExp(c.n.replace(/[市町村]$/,''),'g'),'').replace(/^(沖縄県|沖縄|行政区|地域|エリア|の|内)+/g,'').trim();return n||raw.trim()||c.top}function tr(c,n){let t=c.n+n;if(/辺野古|久辺|豊原|二見|基地|キャンプ|嘉手納|金武|伊平|桑江|美浜|北谷|普天間|山内/.test(t))return'基地・生活導線';if(/港|空港|国際通り|牧港|小禄|美浜|豊崎|商業|市場/.test(t))return'商業・交通導線';if(/ビーチ|恩納|瀬底|座間味|竹富|観光|リゾート/.test(t))return'観光・リゾート導線';return'住宅・地域コミュニティ'}function make(c,n,k){let trait=k?k[2]:tr(c,n),base=/基地|辺野古|嘉手納|金武|普天間|山内|伊平|桑江|美浜|北谷/.test(c.n+n+trait),tour=/観光|リゾート|ビーチ|美浜|豊崎|恩納|座間味|竹富/.test(c.n+n+trait),comm=!base&&!tour,g=k?k[3]:Math.max(1,Math.round(c.g*.055*10)/10),score=k?k[4]:Math.max(1,Math.min(100,Math.round((c.nb+(base?10:tour?8:0)+(comm?c.yu*.15:0))*10)/10));return{city:c.n,region:c.r,district:n,trait,cityGdpOku:c.g,population:c.p,incomeMan:c.i,adminCount:c.a,segment:c.s,estimatedDistrictGdpOku:g,score,newBiz:Math.max(0,Math.min(100,Math.round((c.nb+(base?7:tour?9:-2))*10)/10)),conformity:Math.max(0,Math.min(100,Math.round((c.cp+(comm?7:base?-4:-2))*10)/10)),yuimaru:Math.max(0,Math.min(100,Math.round((c.yu+(comm?8:3))*10)/10)),retention:Math.max(0,Math.min(100,Math.round((c.lr+(comm?7:4))*10)/10)),baseFit:base?90:(c.bf>0?74:48),tourismFit:tour?90:(c.rs>0?74:42),evidence:k?k[5]:'estimated'}}function strategy(d){if(d.baseFit>=85)return'基地・米軍家族導線を前提に、英語予約、駐車、紹介、Google Map導線、家族同伴の安心感を行政区単位で検証。';if(d.tourismFit>=85)return'観光・商業導線を使い、認知獲得、体験価値、写真/記念需要、MEO反応を検証。';if(d.conformity>=60)return'同調圧力・地域抵抗が出やすいため、既存店提携、紹介者、自治会単位の小実証から開始。';return'市町村GDPと生活導線を使い、予約率、紹介率、初回来店経路を行政区別に検証。'}function all(){return cities.flatMap(c=>{let b=known.filter(k=>k[0]===c.n).map(k=>make(c,k[1],k));if(c.top&&!b.some(d=>d.district===c.top))b.push(make(c,c.top));return b})}function hits(){let raw=$('q').value.trim(),q=norm(raw),cs=$('citySelect').value;let rows=all().filter(d=>(!cs||d.city===cs)&&(!q||norm([d.city,d.city+d.district,d.district,d.trait,d.segment].join(' ')).includes(q)));if(q&&rows.length===0){let c=cityOf(q)||cities.find(x=>x.n===cs);if(c)rows=[make(c,clean(c,raw))]}return rows.sort((a,b)=>b.score-a.score)}function line(l,v,cls=''){return'<div style="margin:13px 0"><b>'+l+'</b><span style="float:right">'+v+'</span><div class="score"><div class="bar '+cls+'" style="width:'+Math.max(0,Math.min(100,v))+'%"></div></div></div>'}function payload(){let d=selected;return{沖縄県データ:{対象:'沖縄県41市町村',行政区GDP元データ:'行政区別推計税収_20260609',可視化タブ:'行政区GDP可視化_20260614'},市町村データ:{市町村:d.city,地域:d.region,人口:d.population,市町村GDP_億円:d.cityGdpOku,所得_一人_万円:d.incomeMan,行政区数:d.adminCount,セグメント:d.segment},行政区データ:{行政区:d.district,地域特性:d.trait,行政区推計GDP_億円:d.estimatedDistrictGdpOku,総合スコア:d.score,新規親和:d.newBiz,同調圧力_地域抵抗:d.conformity,既存店_ユイマール優位:d.yuimaru,地元還流_紹介適性:d.retention,基地_米軍家族適性:d.baseFit,観光商業適性:d.tourismFit,証拠レーン:d.evidence,戦略:strategy(d)},注意:'行政区GDPは市町村GDPを行政区推定税収シェアで按分した調査分析用推計を含みます。'}}function csv(){let p=payload(),flat={...p.市町村データ,...p.行政区データ},ks=Object.keys(flat),esc=v=>'"'+String(v).replaceAll('"','""')+'"';return ks.join(',')+'\n'+ks.map(k=>esc(flat[k])).join(',')}function renderExtract(){$('extract').value=mode==='json'?JSON.stringify(payload(),null,2):csv()}function renderResults(){let rows=hits().slice(0,14);$('results').innerHTML=rows.length?rows.map((r,i)=>'<button class="result" data-i="'+i+'"><b>'+r.district+'</b><small>'+r.city+' / '+r.trait+' / GDP '+r.estimatedDistrictGdpOku+'億円</small></button>').join(''):'<p class="note">該当なし。市町村名＋行政区名で推計できます。</p>';$('results').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{selected=rows[i];render()});return rows}function render(){let d=selected||hits()[0]||all()[0];selected=d;$('title').textContent=d.city+' / '+d.district;$('summary').textContent=d.trait+'。市町村GDP '+fmt.format(d.cityGdpOku)+'億円、行政区推計GDP '+fmt.format(d.estimatedDistrictGdpOku)+'億円、総合スコア '+d.score+'。';$('tags').innerHTML=[d.region,d.segment,d.evidence].map(x=>'<span class="pill">'+x+'</span>').join('');$('kpis').innerHTML='<div class="kpi"><span>市町村GDP</span><b>'+fmt.format(d.cityGdpOku)+'億円</b></div><div class="kpi"><span>行政区推計GDP</span><b>'+fmt.format(d.estimatedDistrictGdpOku)+'億円</b></div><div class="kpi"><span>人口</span><b>'+fmt.format(d.population)+'人</b></div><div class="kpi"><span>行政区数</span><b>'+d.adminCount+'区</b></div>';$('scores').innerHTML=line('新規ビジネス親和',d.newBiz)+line('基地・米軍家族適性',d.baseFit)+line('同調圧力・地域抵抗',d.conformity,'red')+line('地元還流・紹介適性',d.retention,'yellow');$('strategy').textContent=strategy(d);$('risk').textContent=d.evidence.includes('estimated')?'推計レーンです。シート上では行政区推定税収シェアから行政区GDPを作成済み。現地反応で検証してください。':'観測メタデータを含む行政区です。実運用KPIで継続検証してください。';renderExtract();renderTable()}function renderTable(){let rows=hits();$('table').innerHTML=rows.map(r=>'<tr><td>'+r.city+'</td><td><b>'+r.district+'</b><br><span class="note">'+r.trait+'</span></td><td>'+r.estimatedDistrictGdpOku+'億円</td><td>'+r.score+'</td><td><span class="status">'+r.evidence+'</span></td><td>'+strategy(r)+'</td></tr>').join('')}$('citySelect').innerHTML='<option value="">全市町村</option>'+cities.map(c=>'<option>'+c.n+'</option>').join('');$('citySelect').onchange=()=>{selected=null;renderResults();render()};$('q').oninput=()=>{let rows=renderResults();if(rows[0])selected=rows[0];render()};$('analyzeBtn').onclick=()=>{let rows=hits();if(rows[0]){selected=rows[0];render()}};$('jsonBtn').onclick=()=>{mode='json';renderExtract()};$('csvBtn').onclick=()=>{mode='csv';renderExtract()};$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('extract').value);$('copyBtn').textContent='コピー済み';setTimeout(()=>$('copyBtn').textContent='コピー',1200)};renderResults();render();</script></body></html>
