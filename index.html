<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沖縄県 行政区GDP・交通量スコア</title><style>:root{color-scheme:dark;--bg:#061411;--p:#0d211d;--l:#1d5c4e;--t:#eef8f4;--m:#94bbb1;--g:#35d39b;--b:#4db7ff;--y:#f3b543;--r:#ee6575}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 0,#123d33 0,#061411 35%,#040b0a 100%);color:var(--t);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif}.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}.side{border-right:1px solid var(--l);background:#071a16;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:12px;letter-spacing:.13em;color:var(--g);font-weight:800}.side h1{font-size:22px;line-height:1.35;margin:10px 0 22px}.label{font-size:13px;color:#9bd6c8;font-weight:800;margin:16px 0 8px}select,input,textarea{width:100%;border:1px solid #287866;background:#09231d;color:var(--t);border-radius:12px;padding:14px;font:inherit}.btn,.result{border:1px solid #2c8b74;background:#0d2a23;color:var(--t);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}.btn:hover,.result:hover{border-color:var(--g);background:#123a31}.results{display:grid;gap:8px;margin-top:12px}.result small{display:block;color:var(--m);margin-top:4px}.main{padding:28px;max-width:1340px;width:100%;margin:auto}.hero,.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.grid{margin-top:18px}.card{background:rgba(12,33,28,.92);border:1px solid #1d594c;border-radius:14px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.22)}h2{margin:0 0 14px;font-size:28px}.lead{color:#b6d5ce;line-height:1.75}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{background:#0a1e19;border:1px solid #1e5a4d;border-radius:12px;padding:14px}.kpi b{display:block;font-size:25px}.kpi span{color:var(--m);font-size:12px}.pill{display:inline-flex;border:1px solid #3b8f7a;border-radius:999px;padding:5px 10px;color:#c4efe3;font-size:12px;margin:4px 6px 4px 0}.scoreline{margin:13px 0}.scoreline b{display:flex;justify-content:space-between;gap:12px}.score{height:9px;background:#18362f;border-radius:999px;overflow:hidden;margin-top:8px}.bar{height:100%;background:linear-gradient(90deg,var(--g),var(--b));width:0}.bar.gold{background:linear-gradient(90deg,var(--y),#ffdb7a)}.bar.red{background:linear-gradient(90deg,var(--r),#ff9cab)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border-bottom:1px solid #1a4a40;padding:12px;text-align:left;vertical-align:top}th{color:#9edac9;background:#09231d}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tool{border:1px solid #2d806d;background:#0a211c;color:var(--t);border-radius:10px;padding:9px 12px;cursor:pointer}textarea{min-height:245px;font-family:ui-monospace,Consolas,monospace;font-size:12px}.note{font-size:12px;color:#8eb9af;line-height:1.7}@media(max-width:940px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.hero,.grid{grid-template-columns:1fr}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="brand">OKINAWA TRAFFIC INTELLIGENCE</div><h1>行政区GDP × 交通量・国道・県道・高速導線スコア</h1><div class="label">市町村</div><select id="citySelect"></select><div class="label">地域名・行政区名で検索</div><input id="q" placeholder="例：名護市字辺野古 / 北谷町桑江 / 美浜"><div class="results" id="results"></div><div class="label">調査分析</div><button class="btn" id="analyzeBtn">選択地域を分析する</button><p class="note">行政区GDPは市町村GDPと行政区推定税収からの按分推計です。交通量・道路は市町村単位の観測/整理データを行政区へ補正して使います。</p></aside><main class="main"><section class="hero"><div class="card"><h2 id="title">調査分析地域を入力してください</h2><p class="lead" id="summary"></p><div id="tags"></div></div><div class="card kpis" id="kpis"></div></section><section class="grid"><div class="card"><h2>スコア可視化</h2><div id="scores"></div></div><div class="card"><h2>道路・出店判断</h2><p class="lead" id="strategy"></p><p class="note" id="risk"></p></div></section><section class="card" style="margin-top:18px"><h2>抽出データ</h2><div class="toolbar"><button class="tool" id="jsonBtn">JSON</button><button class="tool" id="csvBtn">CSV</button><button class="tool" id="copyBtn">コピー</button></div><textarea id="extract" spellcheck="false"></textarea></section><section class="card" style="margin-top:18px"><h2>交通補正後スコア上位</h2><table><thead><tr><th>市町村</th><th>行政区</th><th>行政区GDP</th><th>道路</th><th>交通補正</th><th>判断</th></tr></thead><tbody id="table"></tbody></table></section></main></div><script>const cities=[{n:"北谷町",r:"中部",g:874,p:28322,road:"国道58号,58号バイパス",pref:"県道24号,130号",hwy:"なし",max:63851,high:0,rs:72.6,seg:"国道58号最高水準・アメリカンビレッジ・米軍住宅高密度",risk:"高交通量・渋滞/視認性両面"},{n:"浦添市",r:"中部",g:4136,p:115897,road:"国道58号,58号バイパス",pref:"県道130号,153号,浦添西原線",hwy:"西原JCT接続",max:55000,high:0,rs:66.2,seg:"国道58号高交通量・大型商業・住宅集積",risk:"高交通量・渋滞/視認性両面"},{n:"那覇市",r:"那覇",g:13939,p:314009,road:"国道58号,329号,330号,331号,332号",pref:"県道42号,43号,47号,82号,153号",hwy:"那覇IC",max:50000,high:11400,rs:73.6,seg:"県都・空港・商業・公共交通結節",risk:"高交通量・渋滞/視認性両面"},{n:"宜野湾市",r:"中部",g:2281,p:100177,road:"国道58号,58号バイパス",pref:"県道34号,81号,130号,153号",hwy:"なし",max:45000,high:0,rs:62.3,seg:"大謝名交差点・普天間/真志喜/コンベンション導線",risk:"幹線導線"},{n:"沖縄市",r:"中部",g:3364,p:142408,road:"国道329号,330号",pref:"県道20号,22号,26号,36号",hwy:"沖縄北IC,沖縄南IC",max:0,high:37592,rs:73.3,seg:"コザ商業軸・嘉手納隣接・高速IC導線",risk:"高速IC導線"},{n:"名護市",r:"北部",g:2209,p:64166,road:"国道58号,329号,505号,449号",pref:"県道14号,110号,名護宜野座線",hwy:"許田IC",max:21000,high:15012,rs:70.2,seg:"北部拠点・辺野古工事需要・観光導線",risk:"高速IC導線"},{n:"嘉手納町",r:"中部",g:393,p:13292,road:"国道58号",pref:"県道24号,沖縄嘉手納線",hwy:"なし",max:28676,high:0,rs:64.0,seg:"嘉手納基地正門周辺・基地経済",risk:"幹線導線"},{n:"金武町",r:"北部",g:211,p:10788,road:"国道329号",pref:"県道104号,屋嘉恩納線",hwy:"金武IC",max:0,high:24381,rs:69.6,seg:"キャンプコートニー隣接・金武IC",risk:"高速IC導線"},{n:"北中城村",r:"中部",g:438,p:18143,road:"国道329号",pref:"県道29号,那覇北中城線",hwy:"北中城IC",max:0,high:54529,rs:72.9,seg:"大型商業・医療福祉・高速IC",risk:"高速IC導線"},{n:"西原町",r:"中部",g:1238,p:35280,road:"国道330号",pref:"宜野湾西原線,浦添西原線",hwy:"西原JCT・西原IC",max:0,high:48027,rs:72.2,seg:"大学・医療・高速IC近接",risk:"高速IC導線"},{n:"読谷村",r:"中部",g:626,p:41524,road:"国道58号,58号読谷道路",pref:"県道6号,12号,16号",hwy:"なし",max:28676,high:0,rs:59.0,seg:"郊外商業・住宅・観光",risk:"幹線導線"},{n:"恩納村",r:"北部",g:488,p:11213,road:"国道58号",pref:"県道6号,104号,恩納バイパス",hwy:"なし",max:19353,high:0,rs:60.4,seg:"リゾートホテル集積・沿岸観光",risk:"幹線導線"},{n:"南風原町",r:"南部",g:965,p:40675,road:"国道506号",pref:"南風原道路,沖縄縦貫道接続",hwy:"南風原北IC・南IC",max:0,high:11400,rs:61.1,seg:"那覇南部ベッドタウン・IC2か所",risk:"高速IC導線"},{n:"豊見城市",r:"南部",g:1659,p:64998,road:"国道332号",pref:"県道7号,那覇糸満線",hwy:"那覇IC至近",max:0,high:0,rs:58.0,seg:"豊崎・空港・大型商業",risk:"幹線導線"},{n:"糸満市",r:"南部",g:1423,p:61438,road:"国道331号,507号",pref:"県道82号,那覇糸満線",hwy:"那覇IC経由",max:0,high:0,rs:55.0,seg:"南部幹線・製造業・漁港",risk:"幹線導線"},{n:"うるま市",r:"中部",g:2712,p:126152,road:"国道329号,330号",pref:"県道6号,石川仲泊線,与那城半島道路",hwy:"石川IC",max:0,high:28895,rs:66.1,seg:"東海岸・製造業・海中道路観光",risk:"高速IC導線"},{n:"中城村",r:"中部",g:407,p:22563,road:"国道329号",pref:"県道29号,35号",hwy:"なし",max:0,high:0,rs:48.0,seg:"南上原住宅・湾岸産業道路",risk:"生活道路/通過量不足"},{n:"与那原町",r:"南部",g:378,p:19644,road:"国道329号,331号",pref:"県道38号,82号",hwy:"なし",max:0,high:0,rs:50.4,seg:"国道分岐点・東海岸玄関口",risk:"幹線導線"}];const known=[{c:"名護市",d:"字辺野古",trait:"米軍基地隣接",g:48.515,base:69.2,road:75.2,traffic:70.7,e:"observed_partial_road+estimated_admin"},{c:"北谷町",d:"字桑江",trait:"一般住宅地・米軍家族生活圏",g:141.61,base:98.4,road:72.6,traffic:92.0,e:"observed_partial_road+estimated_admin"},{c:"北谷町",d:"美浜",trait:"観光商業・アメリカンビレッジ周辺",g:269,base:96,road:72.6,traffic:90.2,e:"observed_partial+estimated"},{c:"北谷町",d:"伊平",trait:"米軍住宅・国道58号生活導線",g:92,base:91,road:72.6,traffic:86.4,e:"estimated"},{c:"沖縄市",d:"山内",trait:"Family Tree Oki 現店舗周辺",g:119,base:84,road:73.3,traffic:81.3,e:"estimated"},{c:"嘉手納町",d:"字嘉手納",trait:"米軍基地隣接",g:127.55,base:100,road:64.0,traffic:91.0,e:"observed_partial_road+estimated_admin"},{c:"金武町",d:"金武",trait:"米軍基地隣接",g:150.85,base:100,road:69.6,traffic:92.4,e:"observed_partial_road+estimated_admin"},{c:"北中城村",d:"島袋",trait:"一般住宅地・高速IC導線",g:124.41,base:100,road:72.9,traffic:93.2,e:"observed_partial_road+estimated_admin"}];let mode="json",selected=null;const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat("ja-JP");function norm(v){return String(v||"").toLowerCase().replace(/[\s　]/g,"")}function cityOf(q){return cities.find(c=>q.includes(norm(c.n))||q.includes(norm(c.n.replace(/[市町村]$/,"") )))}function cleanDistrict(c,raw){return raw.replace(c.n,"").replace(c.n.replace(/[市町村]$/,"") ,"").trim()||c.n+"入力行政区"}function inferTrait(c,name){const t=c.n+name;if(/辺野古|桑江|美浜|伊平|嘉手納|金武|山内|普天間|基地|キャンプ/.test(t))return"基地・米軍家族/生活導線";if(/港|空港|牧港|小禄|豊崎|商業|市場|美浜/.test(t))return"商業・交通導線";if(/ビーチ|恩納|瀬底|観光|リゾート/.test(t))return"観光・リゾート導線";return"住宅・地域コミュニティ"}function scoreFor(c,name){const k=known.find(x=>x.c===c.n&&(norm(name).includes(norm(x.d))||norm(x.d).includes(norm(name))));if(k)return{...k,city:c};const base=/基地|キャンプ|嘉手納|金武|桑江|美浜|辺野古|山内/.test(c.n+name)?78:/商業|港|空港|市場|美浜/.test(name)?74:66;const districtGdp=Math.max(1,Math.round(c.g*.055*10)/10);const traffic=Math.round((base*.75+c.rs*.25)*10)/10;return{c:c.n,d:name,trait:inferTrait(c,name),g:districtGdp,base,road:c.rs,traffic,e:"estimated_from_city_road",city:c}}function all(){return known.map(k=>scoreFor(cities.find(c=>c.n===k.c),k.d))}function hits(){const raw=$("q").value.trim(),q=norm(raw),selectedCity=$("citySelect").value;let rows=all().filter(d=>(!selectedCity||d.c===selectedCity)&&(!q||norm([d.c,d.c+d.d,d.d,d.trait,d.city.seg].join(" ")).includes(q)));if(q&&rows.length===0){const c=cityOf(q)||cities.find(x=>x.n===selectedCity)||cities[0];rows=[scoreFor(c,cleanDistrict(c,raw))]}return rows.sort((a,b)=>b.traffic-a.traffic)}function choose(d){selected=d;render()}function line(label,val,cls=""){return`<div class="scoreline"><b><span>${label}</span><span>${val.toFixed(1)}</span></b><div class="score"><div class="bar ${cls}" style="width:${Math.max(0,Math.min(100,val))}%"></div></div></div>`}function strategy(d){const c=d.city;if(d.road>=70&&d.base>=85)return"米軍家族向け・英語対応・予約導線・駐車場導線の初期テストに強い。交通量は認知獲得に有利だが、渋滞時間帯と入りやすさを現地で確認する。";if(d.road>=70)return"幹線/高速導線が強く、来店型・予約型サービスに使える。看板視認性よりGoogle Map、MEO、駐車場、右左折しやすさを優先して検証。";if(d.base>=85)return"顧客適合は高いが、道路導線は補助確認が必要。紹介・基地周辺コミュニティ・英語予約で導線不足を補う。";return"市町村GDPと地域特性から推計可能。出店前に交通量、道路幅、駐車、右左折、近隣既存店との関係を現地ヒアリングで確認。"}function payload(){const d=selected,c=d.city;return{市町村:c.n,地域:c.r,行政区:d.d,地区特性:d.trait,行政区GDP推計_億円:d.g,基礎調査スコア:d.base,道路アクセススコア:d.road,交通補正後スコア:d.traffic,接続国道:c.road,接続県道:c.pref,高速道路:c.hwy,国道最大交通量_台日:c.max,高速道路交通量_台日:c.high,交通リスク:c.risk,証拠レーン:d.e,注意:"行政区GDPと交通補正は調査分析用推計。現地交通量、MEO反応、予約率、紹介率で検証してください。"}}function csv(){const p=payload(),keys=Object.keys(p),esc=v=>`"${String(v).replaceAll('"','""')}"`;return keys.join(",")+"\n"+keys.map(k=>esc(p[k])).join(",")}function renderExtract(){$("extract").value=mode==="json"?JSON.stringify(payload(),null,2):csv()}function renderResults(){const rows=hits().slice(0,12);$("results").innerHTML=rows.map((r,i)=>`<button class="result" data-i="${i}"><b>${r.d}</b><small>${r.c} / ${r.trait} / 交通補正 ${r.traffic}</small></button>`).join("")||"<p class='note'>該当なし。市町村名+行政区名で推計できます。</p>";$("results").querySelectorAll("button").forEach((b,i)=>b.onclick=()=>choose(rows[i]));return rows}function render(){const d=selected||hits()[0]||all()[0],c=d.city;selected=d;$("title").textContent=`${d.c} / ${d.d}`;$("summary").textContent=`${d.trait}。行政区GDP推計 ${fmt.format(d.g)}億円、基礎調査スコア ${d.base}、道路アクセススコア ${d.road}、交通補正後スコア ${d.traffic}。`;$("tags").innerHTML=[c.r,c.seg,d.e,c.risk].map(x=>`<span class="pill">${x}</span>`).join("");$("kpis").innerHTML=`<div class="kpi"><span>行政区GDP推計</span><b>${fmt.format(d.g)}億円</b></div><div class="kpi"><span>交通補正後</span><b>${d.traffic}</b></div><div class="kpi"><span>国道最大交通量</span><b>${fmt.format(c.max)}台/日</b></div><div class="kpi"><span>高速交通量</span><b>${fmt.format(c.high)}台/日</b></div>`;$("scores").innerHTML=line("基礎調査スコア",d.base)+line("道路アクセススコア",d.road,"gold")+line("交通補正後スコア",d.traffic)+line("渋滞/通過リスク",c.max>=55000?82:c.max===0&&c.high===0?58:66,"red");$("strategy").textContent=strategy(d);$("risk").textContent=`道路情報: ${c.road} / ${c.pref} / ${c.hwy}。証拠レーン: ${d.e}。`;renderExtract();renderTable()}function renderTable(){const rows=all().sort((a,b)=>b.traffic-a.traffic);$("table").innerHTML=rows.map(r=>`<tr><td>${r.c}</td><td><b>${r.d}</b><br><span class="note">${r.trait}</span></td><td>${r.g}億円</td><td>${r.road}</td><td>${r.traffic}</td><td>${strategy(r)}</td></tr>`).join("")}$("citySelect").innerHTML='<option value="">全市町村</option>'+cities.map(c=>`<option>${c.n}</option>`).join("");$("citySelect").onchange=()=>{renderResults();render()};$("q").oninput=()=>{const rows=renderResults();if(rows[0])selected=rows[0];render()};$("analyzeBtn").onclick=()=>{const rows=hits();if(rows[0])choose(rows[0])};$("jsonBtn").onclick=()=>{mode="json";renderExtract()};$("csvBtn").onclick=()=>{mode="csv";renderExtract()};$("copyBtn").onclick=async()=>{await navigator.clipboard.writeText($("extract").value);$("copyBtn").textContent="コピー済み";setTimeout(()=>$("copyBtn").textContent="コピー",1200)};renderResults();render();</script></body></html>
